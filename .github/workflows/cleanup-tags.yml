name: Cleanup Docker Hub Tags

on:
  workflow_dispatch:

jobs:
  delete-tags:
    name: Delete Extra Docker Hub Tags
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate and Delete Tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          echo "Logging into Docker Hub API..."
          LOGIN_RESP=$(curl -s -H "Content-Type: application/json" \
            -X POST \
            -d "{\"username\": \"$DOCKERHUB_USERNAME\", \"password\": \"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/)
          
          TOKEN=$(echo "$LOGIN_RESP" | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain Docker Hub JWT token:"
            echo "$LOGIN_RESP"
            exit 1
          fi
          echo "Successfully authenticated with Docker Hub API."

          for tag in "0.0" "0.0.1" "main"; do
            echo "Attempting to delete tag '$tag'..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/harness-bridge/tags/$tag/")
            echo "Status for '$tag': $STATUS"
            if [ "$STATUS" = "204" ] || [ "$STATUS" = "200" ]; then
              echo "✓ Successfully deleted '$tag'."
            elif [ "$STATUS" = "404" ]; then
              echo "Tag '$tag' does not exist or was already deleted."
            elif [ "$STATUS" = "403" ]; then
              echo "⚠ 403 Forbidden: Docker Hub token does not have Delete permissions (Read/Write only)."
            else
              echo "Unexpected status code $STATUS when deleting '$tag'."
            fi
          done
