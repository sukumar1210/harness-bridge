name: Feature Request
description: Propose an idea or enhancement for Harness Bridge
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Harness Bridge better? Let us know below!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a specific problem or missing harness integration?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Architecture
      description: Describe your proposed solution, tool additions, or workflow improvements.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or workarounds you have considered.
