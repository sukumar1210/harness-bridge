name: Bug Report
description: Report an issue or unexpected behavior in Harness Bridge
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Primary Harness
      description: Which harness were you interacting with?
      options:
        - "Claude Code (claude)"
        - "Antigravity CLI (agy)"
        - "Both (inter-agent delegation)"
        - "Other / Standalone CLI"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Host operating system
      options:
        - "Linux (Ubuntu / Debian)"
        - "Linux (Arch / Fedora / Other)"
        - "macOS"
        - "Windows (PowerShell / CMD)"
        - "Windows (WSL2)"
    validations:
      required: true
  - type: dropdown
    id: workspace_mode
    attributes:
      label: Workspace Mode
      description: Which workspace isolation mode was used?
      options:
        - "worktree (isolated git worktree)"
        - "inherit (direct working copy)"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or commands to reproduce the issue.
      placeholder: |
        1. Run `harness-bridge run --target agy "..."`
        2. Execute MCP tool `bridge_dispatch_task`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Diagnostics
      description: Output of `harness-bridge version` and `harness-bridge list`.
      render: shell
      placeholder: |
        $ harness-bridge version
        $ harness-bridge list
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Traceback
      description: Paste any relevant stderr output or traceback.
      render: text
